<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelsTogether</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <img src="icons/icon48.png" alt="ReelsTogether logo" class="logo" />
      <h1>ReelsTogether</h1>
    </header>

    <!-- Connection status badge -->
    <div id="status-bar" class="status-bar disconnected">
      <span class="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </div>

    <!-- Not in a party -->
    <section id="section-lobby">
      <div class="card">
        <h2>Start a party</h2>
        <p class="hint">Share the code with your friends so they can join.</p>
        <button id="btn-create" class="btn btn-primary">Create Party</button>
      </div>

      <div class="divider"><span>or</span></div>

      <div class="card">
        <h2>Join a party</h2>
        <p class="hint">Enter the 6-character code you received.</p>
        <div class="input-row">
          <input
            id="input-code"
            type="text"
            maxlength="6"
            placeholder="ABC123"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="btn-join" class="btn btn-secondary">Join</button>
        </div>
        <p id="join-error" class="error hidden"></p>
      </div>
    </section>

    <!-- In a party -->
    <section id="section-party" class="hidden">
      <div class="party-banner">
        <span class="party-label">Party code</span>
        <div class="code-display">
          <span id="party-code-display"></span>
          <button id="btn-copy" class="btn-icon" title="Copy code">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        <span id="copy-confirm" class="copy-confirm hidden">Copied!</span>
      </div>

      <div class="party-info">
        <div class="info-row">
          <span class="info-label">Your role</span>
          <span id="party-role" class="badge"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Members</span>
          <span id="party-members" class="badge badge-neutral">—</span>
        </div>
      </div>

      <p class="hint center" id="role-hint"></p>

      <button id="btn-leave" class="btn btn-danger">Leave Party</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
